<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Checkout | Anime World</title>
<meta name="description" content="Enter your delivery details and place your Anime World order.">
<meta name="theme-color" content="#c62828">
<meta property="og:type" content="website">
<meta property="og:title" content="Checkout | Anime World">
<meta property="og:description" content="Enter your delivery details and place your Anime World order.">
<meta property="og:image" content="images/anime.png">
<link rel="stylesheet" href="index.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
<link rel="icon" href="images/Untitled-1.png">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter&family=Play&display=swap" rel="stylesheet">
<script src="index.js" defer></script>
</head>
<body>
<section id="header"></section>
<section class="ph h-contact"><div class="space"><h1>#checkout</h1><p>Almost there. Enter your delivery details</p></div></section>
<section id="checkout" class="section-p1">
<form id="co">
<h3>Delivery Details</h3>
<input name="name" placeholder="Full Name" autocomplete="name" required>
<input type="email" name="email" placeholder="Email" autocomplete="email" required>
<input type="tel" name="phone" placeholder="Phone (10 digits)" pattern="[0-9]{10}" required>
<textarea name="address" rows="3" placeholder="Address" required></textarea>
<div class="two"><input name="city" placeholder="City" required><input name="pin" placeholder="PIN code (6 digits)" pattern="[0-9]{6}" required></div>
<h3>Payment</h3>
<label><input type="radio" name="pay" value="Cash on Delivery" checked> Cash on Delivery</label>
<label><input type="radio" name="pay" value="UPI"> UPI</label>
<label><input type="radio" name="pay" value="Card"> Credit / Debit Card</label>
<p class="note">This is a demo store. No real payment is taken.</p>
<button class="btn">Place Order</button>
</form>
<div id="sum"><h3>Order Summary</h3><ul id="oi"></ul><table><tbody id="tt"></tbody></table></div>
</section>
<footer class="footer"></footer>
</body>
</html>
