<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cart | Anime World</title>
<meta name="description" content="Review the items in your Anime World cart.">
<meta name="theme-color" content="#c62828">
<meta property="og:type" content="website">
<meta property="og:title" content="Cart | Anime World">
<meta property="og:description" content="Review the items in your Anime World cart.">
<meta property="og:image" content="images/anime.png">
<link rel="stylesheet" href="index.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
<link rel="icon" href="images/Untitled-1.png">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter&family=Play&display=swap" rel="stylesheet">
<script src="index.js" defer></script>
</head>
<body>
<section id="header"></section>
<section class="ph h-contact"><div class="space"><h1>#your_cart</h1><p>Review your items before checkout</p></div></section>
<section id="cart" class="section-p1">
<table>
<thead><tr><td>No.</td><td>Image</td><td>Product</td><td>Price</td><td>Quantity</td><td>Subtotal</td><td>Remove</td></tr></thead>
<tbody></tbody>
</table>
</section>
<section id="cart-add" class="section-p1">
<div id="coupon"><h3>Apply Coupon</h3><div><input id="cc" type="text" placeholder="Try ANIME10 or WELCOME100" aria-label="Coupon code"><button class="btn" id="ap">APPLY</button></div><p id="cm"></p></div>
<div id="sub"><h3>Cart Total</h3><table><tbody id="tt"></tbody></table><a class="btn" href="checkout.html">Proceed to Checkout</a></div>
</section>
<footer class="footer"></footer>
</body>
</html>
